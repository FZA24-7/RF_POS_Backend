<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server settings</title>
    <style>
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        color: #0f172a;
        background: #fff;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: #475569;
        margin: 0 0 16px;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        font-size: 14px;
        border: 1px solid #94a3b8;
        border-radius: 6px;
      }
      input:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #94a3b8;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #msg {
        min-height: 20px;
        font-size: 13px;
        margin-top: 10px;
      }
      #msg.err {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>Server settings</h1>
    <p>
      Enter the address of the computer that runs the POS server, for example
      <strong>http://192.168.1.10:4000</strong>. This computer only shows the screens; all data
      stays on the server.
    </p>
    <label for="addr">Server address</label>
    <input id="addr" autocomplete="off" spellcheck="false" placeholder="http://192.168.1.10:4000" />
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="row">
      <button id="cancel" type="button">Cancel</button>
      <button id="force" type="button" hidden>Save anyway</button>
      <button id="save" type="button" class="primary">Test and save</button>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
